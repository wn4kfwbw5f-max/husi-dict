<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color"="#0f1115" />
<title>胡思辞典 · 内置词条后台</title>
<style>
  :root{
    --bg:#0f1115; --bg2:#14171e; --panel:#171b23; --card:#1c212b;
    --ink:#f3f4f7; --ink-soft:#9aa1ad; --line:rgba(255,255,255,.08);
    --accent:#FF8A5B; --accent2:#E6728F; --ok:#5d8a63; --danger:#e06a6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 80% at 50% -10%, #1a1f29 0%, var(--bg) 55%);
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:24px 18px 80px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand{font-size:22px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;line-height:1.7}
  .sub a{color:var(--accent);text-decoration:none}
  .stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:110px}
  .stat b{display:block;font-size:24px;font-weight:900;color:var(--accent)}
  .stat span{font-size:12px;color:var(--ink-soft)}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .btn{border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;
       background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1206;transition:.15s}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);font-weight:700}
  .btn:disabled{opacity:.5;cursor:default}
  .searchbox{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--ink);font-size:14px;height:40px;outline:none;}
  .searchbox:focus{border-color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
        animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .word{font-size:20px;font-weight:900;letter-spacing:1px}
  .pos{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);padding:2px 9px;border-radius:999px}
  .actions{margin-left:auto;display:flex;gap:6px}
  .iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);border-radius:10px;padding:5px 10px;font-size:12px;cursor:pointer}
  .iconbtn.danger{color:var(--danger);border-color:rgba(224,106,106,.4)}
  .def{margin-top:8px;line-height:1.65;font-size:14px;color:var(--ink)}
  .ext{margin-top:8px;background:rgba(255,138,91,.08);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.6;color:var(--ink-soft);white-space:pre-wrap}
  .ext:empty{display:none}
  .meta{margin-top:8px;font-size:11.5px;color:#5b626e}
  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:40px 0}

  /* 表单弹层 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:0}
  .mask.show{display:flex;animation:fade .25s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--bg2);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .sheet h3{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:6px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:700}
  .field input,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:14px;font-family:inherit;outline:none;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{min-height:90px}
  .row{display:flex;gap:10px;margin-top:14px}
  .row .btn{flex:1}

  /* 登录态 */
  .login{padding:40px 0;text-align:center}
  .login .card{max-width:380px;margin:0 auto;padding:24px}
  .login input{margin-top:14px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font-size:14px;outline:none}
  .login input:focus{border-color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;z-index:50}
  .toast.show{opacity:.94;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>胡思辞典 · 内置词条后台</div>
  </div>
  <p class="sub">
    给自己用的词条添加器：手动填词/词性/释义，<strong>乱想Time 交给 AI 按词生成</strong>，保存后主站刷新即见。
    <br>使用者在小红书留言 → 你手动添加到这里 → 主站自动同步。👉 <a href="https://707eb172194149b4a396eee865896ef4.app.workbuddy.link" target="_blank">打开胡思辞典主站</a>
    &nbsp;·&nbsp; <a href="javascript:logout()">退出登录</a>
  </p>

  <!-- 登录态 -->
  <div id="loginView" class="login" style="display:none">
    <div class="card">
      <h3 style="margin-top:0">🔑 管理员登录</h3>
      <p style="color:var(--ink-soft);font-size:13px;margin:6px 0 0">输入后台密钥（<code>husi-admin-7q2x9k3m</code>）</p>
      <input id="tokenInput" type="password" placeholder="husi-admin-7q2x9k3m" autocomplete="off" />
      <button class="btn" style="width:100%;margin-top:12px" onclick="doLogin()">进入后台</button>
    </div>
  </div>

  <!-- 后台内容 -->
  <div id="adminView" style="display:none">
    <div class="stats">
      <div class="stat"><b id="statCount">0</b><span>内置词条数</span></div>
      <div class="stat"><b id="statLast">—</b><span>最近更新</span></div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="openForm()">＋ 新增词条</button>
      <input id="searchBox" class="searchbox" placeholder="搜索词/释义/延展…" oninput="renderList()" />
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<!-- 编辑/新增表单 -->
<div class="mask" id="formMask">
  <div class="sheet">
    <h3 id="formTitle">新增词条 ＋</h3>
    <div class="field"><label>词</label><input id="fWord" maxlength="20" placeholder="比如：摸鱼 / 周末 / 爱情公寓" /></div>
    <div class="field">
      <label>词性</label>
      <input id="fPos" maxlength="20" placeholder="比如：名词 / 动词 / 拟声词" value="名词" />
    </div>
    <div class="field">
      <label>释义（手动写，一句俏皮定义）</label>
      <textarea id="fDef" maxlength="200" placeholder="例：【名词】，早八人的合法提神咒语，副作用是让你误以为今天能行。"></textarea>
    </div>
    <div class="field">
      <label>乱想Time 延展（可选 —— 可让 AI 按上面的词+释义生成）</label>
      <textarea id="fExt" maxlength="400" placeholder="不填也行，点下面按钮让 AI 写，或直接手动写"></textarea>
      <button class="btn ghost" id="aiGenBtn" onclick="aiGenExt()" style="margin-top:8px">✨ AI 生成乱想Time</button>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="closeForm()">取消</button>
      <button class="btn" id="formSaveBtn" onclick="saveForm()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 配置 ============ */
const API = "https://husi-d0gzi7winfcad405e-1462114755.ap-shanghai.app.tcloudbase.com";
const TOKEN_KEY = "husi_dict_admin_token";

/* ============ 登录态 ============ */
const token = localStorage.getItem(TOKEN_KEY);
if(token){
  document.getElementById("loginView").style.display = "none";
  document.getElementById("adminView").style.display = "block";
  loadList();
}else{
  document.getElementById("loginView").style.display = "block";
}
document.getElementById("tokenInput").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });

function doLogin(){
  const t = document.getElementById("tokenInput").value.trim();
  if(!t){ toast("请输入口令"); return; }
  localStorage.setItem(TOKEN_KEY, t);
  location.reload();
}
function logout(){ localStorage.removeItem(TOKEN_KEY); location.reload(); }

/* ============ 列表加载 ============ */
let allItems = [];
let editingId = null;
async function loadList(){
  try{
    const r = await fetch(API+"/api/dict-list?token="+encodeURIComponent(token));
    if(!r.ok){ toast("口令不对，或后端未就绪"); return; }
    const data = await r.json();
    allItems = data.items || [];
    document.getElementById("statCount").textContent = allItems.length;
    if(allItems[0] && allItems[0].updated_at){
      document.getElementById("statLast").textContent = new Date(allItems[0].updated_at).toLocaleString("zh-CN",{hour12:false});
    }
    renderList();
  }catch(e){ toast("加载失败："+e.message); }
}

function renderList(){
  const q = (document.getElementById("searchBox").value||"").trim().toLowerCase();
  const arr = q ? allItems.filter(it =>
    (it.word||"").toLowerCase().includes(q) ||
    (it.def||"").toLowerCase().includes(q) ||
    (it.ext||"").toLowerCase().includes(q) ||
    (it.pos||"").toLowerCase().includes(q)
  ) : allItems;
  const host = document.getElementById("list");
  if(!arr.length){
    host.innerHTML = `<div class="empty">${q ? "没有匹配的词条" : "暂无内置词条，点上方「新增词条」开始添加"}</div>`;
    return;
  }
  host.innerHTML = arr.map(it => `
    <div class="card" data-id="${it.id}">
      <div class="head">
        <div class="word">${escapeHtml(it.word)}</div>
        <div class="pos">${escapeHtml(it.pos||"名词")}</div>
        <div class="actions">
          <button class="iconbtn" onclick="editItem('${it.id}')">编辑</button>
          <button class="iconbtn danger" onclick="deleteItem('${it.id}','${escapeHtml(it.word)}')">删除</button>
        </div>
      </div>
      <div class="def">${escapeHtml(it.def)}</div>
      <div class="ext">${escapeHtml(it.ext||"")}</div>
      <div class="meta">${it.updated_at ? "更新："+new Date(it.updated_at).toLocaleString("zh-CN",{hour12:false}) : ""}</div>
    </div>
  `).join("");
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

/* ============ 表单（新增 / 编辑） ============ */
function openForm(id){
  editingId = id || null;
  document.getElementById("formTitle").textContent = id ? "编辑词条 ✎" : "新增词条 ＋";
  if(id){
    const it = allItems.find(x=>x.id===id);
    if(!it){ toast("找不到该词条"); return; }
    document.getElementById("fWord").value = it.word||"";
    document.getElementById("fPos").value = it.pos||"名词";
    document.getElementById("fDef").value = it.def||"";
    document.getElementById("fExt").value = it.ext||"";
  }else{
    ["fWord","fPos","fDef","fExt"].forEach(k=>document.getElementById(k).value = (k==="fPos"?"名词":""));
  }
  document.getElementById("formMask").classList.add("show");
  setTimeout(()=>document.getElementById("fWord").focus(), 200);
}
function closeForm(){ document.getElementById("formMask").classList.remove("show"); editingId = null; }
document.getElementById("formMask").addEventListener("click", e=>{ if(e.target.id==="formMask") closeForm(); });

async function saveForm(){
  const word = document.getElementById("fWord").value.trim();
  const pos  = document.getElementById("fPos").value.trim() || "名词";
  const def  = document.getElementById("fDef").value.trim();
  let   ext  = document.getElementById("fExt").value.trim();
  if(!word || !def){ toast("词和释义必填"); return; }
  const btn = document.getElementById("formSaveBtn");
  btn.disabled = true; btn.textContent = "保存中…";
  try{
    // 乱想Time 为空 → 自动让 AI 基于词+释义生成（失败不阻塞保存）
    if(!ext){
      try{
        const r = await fetch(API+"/api/explain", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ word, existingEntry: def })
        });
        if(r.ok){ const d = await r.json(); if(d.ext) ext = d.ext; }
      }catch(e){ /* AI 失败就用空延展保存 */ }
    }
    if(editingId){
      const r = await fetch(API+"/api/dict-update?token="+encodeURIComponent(token), {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id:editingId, word, pos, def, ext })
      });
      if(!r.ok) throw new Error(await r.text());
    }else{
      const r = await fetch(API+"/api/dict-add?token="+encodeURIComponent(token), {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ word, pos, def, ext })
      });
      if(!r.ok) throw new Error(await r.text());
    }
    closeForm();
    await loadList();
    toast(editingId ? "已更新，下次有人打开主站就能看到" : "已新增，主站下次刷新就有它");
  }catch(e){ toast("保存失败："+e.message); }
  btn.disabled = false; btn.textContent = "保存";
}

function editItem(id){ openForm(id); }

/* ============ AI 生成乱想Time（基于词+释义） ============ */
async function aiGenExt(){
  const word = document.getElementById("fWord").value.trim();
  const def  = document.getElementById("fDef").value.trim();
  if(!word || !def){ toast("先把「词」和「释义」填好，AI 才知道怎么展开"); return; }
  const btn = document.getElementById("aiGenBtn");
  btn.disabled = true; btn.textContent = "✨ AI 构思中…";
  try{
    const r = await fetch(API+"/api/explain", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ word, existingEntry: def })
    });
    if(!r.ok) throw new Error(await r.text());
    const data = await r.json();
    if(data.ext) document.getElementById("fExt").value = data.ext;
    toast("乱想Time 已生成，可微调或直接用");
  }catch(e){ toast("AI 生成失败："+e.message); }
  btn.disabled = false; btn.textContent = "✨ AI 生成乱想Time";
}

async function deleteItem(id, word){
  if(!confirm(`确定删除「${word}」？此操作不可撤销。`)) return;
  try{
    const r = await fetch(API+"/api/dict-delete?token="+encodeURIComponent(token), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ id })
    });
    if(!r.ok) throw new Error(await r.text());
    await loadList();
    toast("已删除");
  }catch(e){ toast("删除失败："+e.message); }
}

/* ============ toast ============ */
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove("show"), 2400);
}
</script>
</body>
</html>
